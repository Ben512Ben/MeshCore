name: Make Wikipedia SD card files

# Run this by hand: Actions tab -> "Make Wikipedia SD card files" -> Run workflow.
# It downloads a Kiwix Wikipedia "mini" file, converts it with tools/wiki/wiki_to_sd.py and attaches the three
# card files (wiki.idx, wiki.txt, wiki.meta) to a new GitHub Release, ready to download and copy to the SD card.

on:
  workflow_dispatch:
    inputs:
      zim_url:
        description: "Direct URL of a Kiwix Wikipedia mini ZIM. Leave empty for the latest Simple English file (mini, else nopic, else maxi)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install converter requirements
        run: pip install libzim beautifulsoup4 lxml

      - name: Test the converter
        run: python3 tools/wiki/test_wiki_to_sd.py

      - name: Find the ZIM file
        id: find
        env:
          ZIM_URL: ${{ inputs.zim_url }}
        run: |
          url="$ZIM_URL"
          if [ -z "$url" ]; then
            base="https://download.kiwix.org/zim/wikipedia/"
            curl -fsSL "$base" -o listing.html
            echo "Simple English files in the Kiwix list:"
            grep -oE 'wikipedia_[a-z_-]*simple[a-z_]*_[0-9]{4}-[0-9]{2}\.zim' listing.html | sort -u || true
            name=""
            for flavour in mini nopic maxi; do
              name=$(grep -oE "wikipedia_[a-z_-]*simple_all_${flavour}_[0-9]{4}-[0-9]{2}\.zim" listing.html | sort -u | tail -1 || true)
              if [ -n "$name" ]; then break; fi
            done
            if [ -z "$name" ]; then
              echo "Could not find a Simple English file at $base"
              echo "Open that page in your browser, copy the link of a Simple English .zim file and paste it into the zim_url box."
              exit 1
            fi
            url="$base$name"
          fi
          echo "Using $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download the ZIM file
        env:
          ZIM_URL: ${{ steps.find.outputs.url }}
        run: |
          df -h .
          curl -fL --retry 5 --retry-delay 10 -o wiki.zim "$ZIM_URL"
          ls -l wiki.zim

      - name: Convert
        run: |
          mkdir -p out
          python3 tools/wiki/wiki_to_sd.py wiki.zim out
          ls -l out

      - name: Publish a release with the card files
        env:
          GH_TOKEN: ${{ github.token }}
          ZIM_URL: ${{ steps.find.outputs.url }}
        run: |
          tag="wiki-$(date -u +%Y%m%d-%H%M)"
          cat out/wiki.meta > notes.txt
          printf '\nSource file: %s\n\nCopy wiki.idx, wiki.txt and wiki.meta into a folder named trailbot on the SD card.\n' "$ZIM_URL" >> notes.txt
          gh release create "$tag" out/wiki.idx out/wiki.txt out/wiki.meta --title "Wikipedia SD card files $tag" --notes-file notes.txt
